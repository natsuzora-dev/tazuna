name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install z3
        env:
          Z3_VERSION: "5.4.1"
          Z3_SHA256: b548bac48ef2452b4e09ea2945cf4b011d5f43fcf39e4799df268ee7e0769d85
        run: |
          curl -sSfL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/z3-$Z3_VERSION-x64-glibc-2.39.zip"
          echo "$Z3_SHA256  z3.zip" | sha256sum -c -
          unzip -q z3.zip -d "$RUNNER_TEMP/z3"
          rm z3.zip
          bin="$(dirname "$(find "$RUNNER_TEMP/z3" -type f -name z3 -path '*/bin/*')")"
          "$bin/z3" --version | grep -qF "$Z3_VERSION"
          echo "$bin" >> "$GITHUB_PATH"
      - run: scripts/check
      # The samples are user documentation, not tests of tazuna: converting them and regenerating their inputs only
      # catch a change to the DSL or to search that leaves a README's spec or its inputs/ behind. They stay out of
      # scripts/check so the commit hook does not pay for them.
      - name: Check the todo sample still converts and its inputs are current
        working-directory: samples/todo/spec
        env:
          TAZUNA_ENGINE: ${{ github.workspace }}/lean/.lake/build/bin/tazuna-engine
        run: |
          gleam run -m tazuna -- search todo_spec "$RUNNER_TEMP/inputs" >/dev/null
          diff -r inputs "$RUNNER_TEMP/inputs" ||
            { echo "samples/todo/spec/inputs is stale. Run: rm -r inputs && gleam run -m tazuna -- search todo_spec inputs"; exit 1; }
      - name: Check the shop sample still converts and its inputs are current
        working-directory: samples/shop/spec
        env:
          TAZUNA_ENGINE: ${{ github.workspace }}/lean/.lake/build/bin/tazuna-engine
        run: |
          gleam run -m tazuna -- search shop_spec "$RUNNER_TEMP/shop-inputs" --jobs 4 >/dev/null
          diff -r inputs "$RUNNER_TEMP/shop-inputs" ||
            { echo "samples/shop/spec/inputs is stale. Run: rm -r inputs && gleam run -m tazuna -- search shop_spec inputs"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: samples/shop/web/package-lock.json
      # The shop's implementation is user documentation too: its replay and end-to-end traces must still pass verify
      # against the spec, so a change to the trace format or to verify cannot leave the README's example behind.
      - name: Check the shop sample's implementation against its spec
        working-directory: samples/shop/web
        env:
          TAZUNA_ENGINE: ${{ github.workspace }}/lean/.lake/build/bin/tazuna-engine
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run e2e
          npm run verify
          npm run verify:e2e
