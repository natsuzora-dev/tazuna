name: engine

# Builds the engine package of each platform on a runner of that platform and keeps each packed package as an
# artifact. It publishes nothing: the owner downloads the artifacts and runs npm publish on each.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15, binary: tazuna-engine }
          - { platform: darwin-x64, runner: macos-15-intel, binary: tazuna-engine }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, binary: tazuna-engine }
          - { platform: linux-x64, runner: ubuntu-24.04, binary: tazuna-engine }
          - { platform: win32-x64, runner: windows-2025, binary: tazuna-engine.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the engine
        working-directory: lean
        run: lake build tazuna-engine
      - name: Pack the engine package
        working-directory: npm/${{ matrix.platform }}
        run: npm pack --pack-destination "$RUNNER_TEMP/packs"
      - name: Show the binary's size and the libraries it loads
        working-directory: npm/${{ matrix.platform }}
        run: |
          ls -l ${{ matrix.binary }}
          case "${{ matrix.platform }}" in
            darwin-*) otool -L ${{ matrix.binary }} ;;
            linux-*) ldd ${{ matrix.binary }}; objdump -T ${{ matrix.binary }} | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 ;;
            win32-*) objdump -p ${{ matrix.binary }} | grep 'DLL Name' ;;
          esac
      - name: Run the engine without Lean
        working-directory: npm/${{ matrix.platform }}
        run: |
          answer=$(echo '{"type":"sort","values":[]}' | env PATH=/usr/bin:/bin ./${{ matrix.binary }})
          echo "$answer"
          case "$answer" in '{"type":'*) ;; *) exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: tazuna-engine-${{ matrix.platform }}
          path: ${{ runner.temp }}/packs/*.tgz
          if-no-files-found: error
