name = "tazuna"
defaultTargets = ["Tazuna", "tazuna-engine", "gen-dsl", "kinds"]

[leanOptions]
autoImplicit = false
linter.extra = true

[[lean_lib]]
name = "Tazuna"
globs = ["Tazuna.+"]

[[lean_exe]]
name = "tazuna-engine"
root = "Main"

[[lean_exe]]
name = "gen-dsl"
root = "GenDsl"

[[lean_exe]]
name = "kinds"
root = "Kinds"
