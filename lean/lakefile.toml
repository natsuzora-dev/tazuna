name = "tazuna-lean"
version = "0.1.0"
defaultTargets = ["Tazuna", "tazuna-lean", "tazuna-generate", "tazuna-axioms"]

[leanOptions]
autoImplicit = false
linter.extra = true

[[lean_lib]]
name = "Tazuna"
globs = ["Tazuna.+"]

[[lean_lib]]
name = "DiffTest"
roots = ["DiffTest.Json", "DiffTest.Protocol"]

[[lean_exe]]
name = "tazuna-lean"
root = "DiffTest.Main"

[[lean_exe]]
name = "tazuna-generate"
root = "Generate.Main"

[[lean_exe]]
name = "tazuna-axioms"
root = "Axioms.Main"
